name: Test on push

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup rust
        uses: ATiltedTree/setup-rust@v1
        with:
          rust-version: nightly
      - name: Run tests
        run: cargo test
